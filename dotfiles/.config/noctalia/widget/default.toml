[widget.active_window]
display = "text_only"
icon_size = 14.0
max_length = 260.0
min_length = 0
title_scroll = "on_hover"
type = "active_window"

[widget.battery]
display_mode = "graphic"
type = "battery"

[widget.brightness]
show_label = false
type = "brightness"

[widget.clock]
format = "{:%H:%M} {:%a}, {:%d. %b %Y}"
type = "clock"

[widget.cpu]
stat = "cpu_usage"
type = "sysmon"

[widget.date]
format = "{:%a %d %b}"
type = "clock"

[widget.input_volume]
device = "input"
show_label = false
type = "volume"

[widget.keyboard_layout]
hide_when_single_layout = false
type = "keyboard_layout"

[widget.launcher]
glyph = "rocket"
type = "launcher"

[widget.lock_keys]
display = "short"
hide_when_off = false
show_caps_lock = true
show_num_lock = true
show_scroll_lock = false
type = "lock_keys"

[widget.media]
art_size = 16.0
max_length = 220.0
min_length = 80.0
title_scroll = "none"
type = "media"

[widget.network]
show_label = false
type = "network"

[widget.network_rx]
stat = "net_rx"
type = "sysmon"

[widget.network_tx]
stat = "net_tx"
type = "sysmon"

[widget.output_volume]
device = "output"
type = "volume"

[widget.ram]
stat = "ram_used"
type = "sysmon"

[widget.spacer]
interactive = false
type = "spacer"

[widget.taskbar]
inactive_opacity = 0.80000000000000004
type = "taskbar"

[widget.temp]
stat = "cpu_temp"
type = "sysmon"

[widget.workspaces]
empty_color = "outline"
hide_when_empty = true
type = "workspaces"
