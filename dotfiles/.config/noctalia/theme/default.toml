[theme]
builtin = "Kanagawa"
community_palette = "Oxocarbon"
custom_palette = ""
mode = "dark"
pure_black_dark = false
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = ["btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "starship"]
community_ids = ["discord", "vscode", "zed"]
enable_builtin_templates = true
enable_community_templates = true

[theme.templates.user.fast-syntax-highlighting]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/fast-syntax-highlighting.ini"
output_path = "$XDG_CONFIG_HOME/zsh/fast-syntax-highlighting/noctalia.ini"
